# Local dev / quick-start infra. See wiki/TECHNICAL_DESIGN.md §2 for packaging rationale.
# The app service itself (the Go binary) isn't containerized here yet — `go run ./cmd/server`
# against this compose file's Postgres/Redis, per config/config.go's defaults.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: porichoy
      POSTGRES_PASSWORD: porichoy
      POSTGRES_DB: porichoy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
